name: Build Riftstone vocation_stats

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build vocation_stats plugin
        shell: cmd
        working-directory: native/plugins/vocation_stats
        run: build.cmd

      - name: Upload build files
        uses: actions/upload-artifact@v7
        with:
          name: Riftstone-Vocation_Stats-Build
          path: native/plugins/vocation_stats/out/
          if-no-files-found: error
          retention-days: 14
